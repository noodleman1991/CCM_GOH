          - img "Mental Health Effects due to the Double burden of COVID-19 and Extreme Heat and Drought in Afghanistan" [ref=e143]
          - generic [ref=e144]:
            - article [ref=e145]:
              - generic [ref=e146]:
                - heading "Brief description of the community/country and its experience of climate change" [level=2] [ref=e147]
                - paragraph [ref=e148]: Afghanistan is experiencing a situation that reflects an intensified level of conflict and COVID-19 with an increasing prevalence of drought due to climate change affecting people's livelihoods (Orzala et al., 2022). The second-worst drought in 4 years (IFRC, 2021) widely affected the livelihoods of people who rely on agriculture and livestock as a primary source of income. As reported by the Special Inspector General for Afghanistan Reconstruction, USAID, the World Bank, and the Program for Asia Resilience to Climate Change (PARCC) have collectively provided $253 million in cash support in response to COVID-19 and drought-affected families (SIGAR, 2021). Afghanistan is the most affected country in terms of the prolonged nature of drought and climate change in the region. Drought has particularly affected the cities of Kandahar and Herat. Afghanistan’s most severe drought in four years reached its nadir in early 2021, which saw wheat harvests decrease by nearly two million tons; in Kandahar, the cropping season has been reduced to two seasons from four, and over three million heads of livestock were at risk due to fodder and water shortages. This environmental crisis coupled with increases in violence has triggered considerable population displacement. In the first half of 2021, more than 600,000 people were displaced due to severe conflict and drought, as reported by the International Federation of Red Cross and Red Crescent Societies (IFRC, 2021).
                - heading "Brief description of the climate-related mental health impacts experienced by the community" [level=2] [ref=e149]
                - paragraph [ref=e150]: "The qualitative study (Orzala et al, 2022) found a significant interplay between climate change and poverty in Kandahar and Herat, particularly in how they affect agricultural livelihoods. Drought, for instance, has dramatically reduced water availability for farming, resulting in lower crop yields and wheat harvests compared to previous years (OCHA, 2018). This has forced people to rely on alternative income sources like daily wage labor and migration. One respondent noted:"
                - paragraph [ref=e151]:
                  - emphasis [ref=e152]: "\"Due to drought and lack of irrigation resources, I was losing my income. COVID has obliged people who were working in the factory and other manufacturing companies to quit their jobs as the companies are shut down. The income that we had from outside is now stopped. As a result, it has severely affected our livelihoods and economic situation\" (Orzala et al, 2022)."
                - paragraph [ref=e153]: Due to these shocks and the reduction in income and low economic situation, people have lost their focus and are in a situation in which they cannot judge and make accurate decisions. This itself is an effect of the climate change.
                - paragraph [ref=e154]:
                  - emphasis [ref=e155]: "Additionally, another respondent said:"
                - paragraph [ref=e156]:
                  - emphasis [ref=e157]: "\"The drought had affected our harvest, and it was a big problem, especially in Herat. The rain was so rare; it means that during winter until April, we had no rain in Herat. To reduce the effects of the drought and limited access to resources, people in both Kandahar and Herat provinces diversified their income sources such as farm and non-farm, through migration and daily wage labor to repay their past debts or in response to drought.” (Huot et al. 2016)."
                - paragraph [ref=e158]: People who are faced with drought and insecurity tried to diversify their income sources. The available alternatives for them were illegal migration to Iran. Migration to Iran itself is taking up arms and putting people in the boiling water which mentally distress and jeopardize the people’s mental health who remained behind for instance parents or other close relatives.
                - heading "Detailed description of the research innovation or dataset" [level=2] [ref=e159]
                - paragraph [ref=e160]: The researchers selected Kandahar and Herat for field work due to the prevalence of COVID-19, insecurity, and climate change. They also considered practical aspects and contextual understanding of these provinces from past research conducted in these areas. For example, losing a harvest season due to climate change and a reduction in the rain when people need water to irrigate their land. The research involved a mixed-method Q-squared approach to investigate poverty and well-being dynamics, including livelihood trajectories. The qualitative toolkit used key informant interviews and life history interviews with women and men in the study sites. The questionnaire tool was tested in a rural context near Kabul, with the study site selected based on security, health, and feasibility considerations. The research team gathered to assess the testing results and collected qualitative data between June and late July 2021. The research aimed to understand well-being, livelihood trajectories, and the impact of crises on households, and it encountered challenges related to security, gender norms, and compounded crises.
                - heading "Key insights and lessons learned" [level=2] [ref=e161]
                - paragraph [ref=e162]: The data highlights the proliferation of impoverishment in Afghanistan, due to the multilayered challenges of COVID-19, climate change, and political instabilities. These crises have created a unique impoverishment factor affecting livelihoods. The research findings show a strong relationship between climate change and poverty, mainly through its impact on agricultural livelihoods. Drought and climate change have significantly affected water sources, leading to declining farming activities and harvest yields. The pandemic, combined with security threats and political instability, has exacerbated the socioeconomic impacts, resulting in a higher probability of poverty and welfare loss. The effect of these crises has drained household resources, contributing to poverty and welfare loss, with the poverty rate rising during the onset of COVID-19. The scarcity of resources and limited opportunities for young adults experiencing poverty have compounded the challenges, leading to a lack of job opportunities and the thinning of social networks both at the village and district level. For instance, in times of difficulty, people attain support from their siblings, relatives, and friends. (Orzala et al., 2022). As a result, people in the target location have been severely affected by the three prolonged crises. This has mentally stressed the local people; hence, they said, ‘We will die of poverty before we die of COVID-19’. Even though the study did not directly cover the effect of mental health, however, the data identified many stressors at the household level. To get a complete understanding of mental health and climate change, there is a high need for separate research that focuses on the relationship between stressors, climate change, and mental health.
                - paragraph [ref=e163]:
                  - strong [ref=e164]: These insights provide valuable guidance for policy responses and interventions addressing similar multilayered crises. The research innovation is highly generalizable to other communities or countries facing similar challenges. The coping strategies like diversified income sources and migration to Iran the households adopt reflect common challenges communities face in similar crises. These insights can inform the development and implementation of research innovations in other regions experiencing overlapping crises, offering a valuable understanding of the complex dynamics of multilayered crises and their impacts on impoverishment. The research comprehensively analyzes the multilayered crisis and its effect on people's impoverishment in Afghanistan. It provides valuable lessons for developing and implementing similar research innovations at local and national levels.
                - heading "Recommendations" [level=2] [ref=e165]
                - paragraph [ref=e166]: The paper's first key recommendation emphasizes the importance of collectively managing overlapping crises, especially in areas facing protracted violence and instability. The 2022 Humanitarian Response Plan recognizes the need for a simultaneous focus on emergency assistance for conflict and disaster-affected individuals and vulnerable populations with humanitarian needs (HRP, 2022). The operational presence of 191 organizations (107 national NGOs, 72 international NGOs, and 12 UN agencies) in Afghanistan highlights the urgency of multi-sectoral interventions, extending beyond food security and agriculture to include education, health services, livelihood support, and inclusive finance. A holistic response is essential for better understanding and addressing long-term issues effectively.
                - paragraph [ref=e167]: Donors are encouraged to use overlapping crises such as COVID-19, conflict, and climate as a framework for poverty monitoring studies, enabling a deeper understanding of poverty and informing tailored poverty reduction strategies. The study highlights the importance of mixed method data to offer both quantitative analysis and qualitative insights, underlining the need for updates to gain further insights.
                - paragraph [ref=e168]: The second recommendation underscores the need to strengthen linkages between humanitarian and development responses to the crisis in Afghanistan. While the immediate priority is a humanitarian response, longer-term development aid-focused responses are equally crucial. Addressing the long-term impacts of COVID-19 on livelihoods is imperative, and integrating social protection with pro-poor economic growth and human development initiatives is essential within the humanitarian-development-peace nexus.
                - paragraph [ref=e169]: The third area focuses on improving the welfare and inclusion of young adults, especially those heading households. The study also highlights the vulnerability of youth-headed households to food insecurity and poverty during COVID-19. Future humanitarian and development programs should prioritize youth-headed households and consider recommendations such as strengthening dialogue in the government, mainstreaming youth inclusion across projects, complementing economic inclusion with social cohesion efforts, and engaging youth as agents of change. Additionally, aid providers should carefully consider the characteristics of each context before planning service delivery to ensure better provision of immediate, short- and longer-term assistance (Orzala et al., 2022).
