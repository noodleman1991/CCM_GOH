            - heading "What do we mean by mental health?" [level=2] [ref=e425]
            - generic [ref=e427]:
              - paragraph [ref=e428]: "Climate change, mental health, and their intersection are complex and wide-ranging fields, understood through a range of diverse perspectives, framings and terminologies.Mental health challenges (which encompass mental health conditions/illnesses) are defined in Connecting Climate Minds as thoughts, feelings, and behaviours that affect a person’s ability to function in one or more areas of life and often involve significant levels of psychological distress. Ways mental health could be affected by climate change include:"
              - list [ref=e429]:
                - listitem [ref=e430]: How climate change may lead to a worsening of pre-existing mental health problems
                - listitem [ref=e431]: How climate change may contribute to the prevalence or impact of existing mental health problems
                - listitem [ref=e432]: How climate change may impact on treatment access or effectiveness for those with mental health problems
                - listitem [ref=e433]: How climate change may lead to new mental health problems.
              - paragraph [ref=e434]: However, we note that a diversity of perspectives were heard through Connecting Climate Minds, and we have sought to appropriately represent and reflect this in the project outputs.
